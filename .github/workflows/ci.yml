name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti da .hs-tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/bin"
          awk -v p=linux-amd64 '$1 !~ /^#/ && $3==p' .hs-tools | while read -r name ver plat sha url; do
            f="$RUNNER_TEMP/dl-$name"
            curl -fsSL "$url" -o "$f"
            echo "$sha  $f" | sha256sum -c -
            case "$url" in
              *.tar.gz|*.tgz)
                d="$RUNNER_TEMP/x-$name"; mkdir -p "$d"; tar -xzf "$f" -C "$d"
                install -m755 "$(find "$d" -type f -name "$name" | head -1)" "$RUNNER_TEMP/tools/bin/$name" ;;
              *) install -m755 "$f" "$RUNNER_TEMP/tools/bin/$name" ;;
            esac
          done
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - run: ./ci

  ci-ok:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.ci.result }}" = "success" ]
