name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./ci
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/attribution.js "$BASE" "$HEAD"
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && git diff --name-only "$BASE" "$HEAD" | grep -qE '^(android/|\.github/workflows/android(-release)?\.yml$)'; then
            echo android=true >> "$GITHUB_OUTPUT"
          else
            echo android=false >> "$GITHUB_OUTPUT"
          fi
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
  ci-ok:
    runs-on: ubuntu-latest
    needs: [ci, attribution, changes, android]
    if: always()
    steps:
      - run: |
          test "${{ needs.ci.result }}" = success
          case "${{ needs.attribution.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.android.result }}" in success|skipped) ;; *) exit 1 ;; esac
          if [ "${{ needs.changes.outputs.android }}" = true ]; then test "${{ needs.android.result }}" = success; fi
